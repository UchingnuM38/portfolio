{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ project.title }}</title>

    <link rel="stylesheet"
          href="{% static 'projects/style.css' %}">

</head>

<body>

<nav class="navbar">

    <h2>Uchingnu Marma</h2>

    <div>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'projects' %}">Projects</a>
    </div>

</nav>


<section class="detail-container">

    {% if project.image %}

        <img class="project-detail-image"
             src="{{ project.image.url }}"
             alt="{{ project.title }}">

    {% endif %}


    <h1>{{ project.title }}</h1>


    <p>
        {{ project.description }}
    </p>


    <h3>Technology Used</h3>

    <p>
        {{ project.technology }}
    </p>


    {% if project.github_link %}

        <a class="btn"
           href="{{ project.github_link }}"
           target="_blank">
            View on GitHub
        </a>

    {% endif %}


    <br><br>

    <a href="{% url 'projects' %}">
        ← Back to Projects
    </a>

</section>


<footer>
    <p>© 2026 Uchingnu Marma</p>
</footer>

</body>
</html>
